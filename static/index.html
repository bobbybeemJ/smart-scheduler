<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NxD Smart Scheduler</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="4.5" width="18" height="16" rx="3" stroke="currentColor" stroke-width="1.6"/>
            <path d="M3 9.5H21" stroke="currentColor" stroke-width="1.6"/>
            <path d="M8 2.5V6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path d="M16 2.5V6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <circle cx="8" cy="13.5" r="1.15" fill="currentColor"/>
            <circle cx="12" cy="13.5" r="1.15" fill="currentColor"/>
            <circle cx="16" cy="13.5" r="1.15" fill="currentColor"/>
            <circle cx="8" cy="17" r="1.15" fill="currentColor"/>
            <circle cx="12" cy="17" r="1.15" fill="currentColor"/>
          </svg>
        </div>
        <div>
          <h1>NxD Smart Scheduler</h1>
          <p class="subtitle">Voice-powered meeting scheduling</p>
        </div>
      </div>
      <div class="status-pill" id="statusPill" data-state="connecting">
        <span class="status-dot"></span>
        <span id="status">Connecting&hellip;</span>
      </div>
    </header>

    <main class="chat-panel">
      <div class="log" id="log">
        <div class="empty-state" id="emptyState">
          <div class="empty-icon">💬</div>
          <p>Try saying something like:</p>
          <p class="example">&ldquo;Schedule a 30-minute meeting next week, not on Wednesday&rdquo;</p>
          <p class="example">&ldquo;Find me 45 minutes after my last meeting today&rdquo;</p>
        </div>
      </div>
    </main>

    <footer class="controls">
      <button id="micBtn" class="mic-btn" disabled aria-label="Start speaking">
        <svg class="mic-icon" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="9" y="2" width="6" height="12" rx="3" fill="currentColor"/>
          <path d="M5 11a7 7 0 0 0 14 0" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M12 18v3.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <path d="M8 21.5h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="mic-ring"></span>
      </button>
      <p class="mic-hint" id="micHint">Waiting for connection&hellip;</p>
    </footer>
  </div>
  <script src="/static/app.js"></script>
</body>
</html>
